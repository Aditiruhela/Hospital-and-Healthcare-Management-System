
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | MediCare</title>

    <link rel="stylesheet" href="staff-login.css">
</head>

<body>

    <header>
        <h1>MediCare</h1>
        <p>Hospital Staff Portal</p>
    </header>

    <main>
        <section class="login-container">

            <div class="login-icon">🔐</div>

            <h2>Staff Login</h2>
            <p class="subtitle">Login to access patient records</p>

            <form id="staff-login-form">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

                <p id="error-message"></p>

            </form>

            <a href="../homepage/index.html">Back to Home</a>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 MediCare Hospital. All Rights Reserved.</p>
    </footer>

    <script src="staff-login.js"></script>

</body>
</html>
